name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only unless a job asks for more.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test tests/SteamNowPlaying.Tests/SteamNowPlaying.Tests.csproj -c Release

      - name: Publish single-file exe
        shell: pwsh
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
        run: |
          $publishArgs = @(
            'publish', 'src/SteamNowPlaying/SteamNowPlaying.csproj',
            '-c', 'Release', '-r', 'win-x64', '--self-contained', 'true',
            '-p:PublishSingleFile=true',
            '-p:IncludeNativeLibrariesForSelfExtract=true',
            '-p:EnableCompressionInSingleFile=true',
            '-p:DebugType=none',
            '-o', 'out'
          )
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $publishArgs += "-p:VersionPrefix=$($env:GITHUB_REF_NAME.TrimStart('v'))"
          } else {
            $publishArgs += '-p:VersionPrefix=0.0.0', "-p:VersionSuffix=dev.$($env:GITHUB_RUN_NUMBER)"
          }
          if ($env:SPOTIFY_CLIENT_ID) {
            $publishArgs += "-p:SpotifyClientId=$($env:SPOTIFY_CLIENT_ID)"
          } else {
            Write-Host "::warning::SPOTIFY_CLIENT_ID repository variable not set; users will need their own Client ID."
          }
          dotnet @publishArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash out/SteamNowPlaying.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SteamNowPlaying.exe" | Out-File out/SHA256SUMS.txt -Encoding ascii -NoNewline
          Get-Content out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SteamNowPlaying
          path: |
            out/SteamNowPlaying.exe
            out/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SteamNowPlaying
          path: out

      - name: Verify checksum
        working-directory: out
        run: sha256sum --check SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/SteamNowPlaying.exe

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/SteamNowPlaying.exe
            out/SHA256SUMS.txt
          generate_release_notes: true
